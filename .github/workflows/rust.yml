name: Rust

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # `rustfmt.toml` uses unstable options; use nightly explicitly (matches `just fmt-check`).
      - name: rustfmt (workspace)
        run: cargo +nightly fmt --all --check

  clippy-test:
    name: Clippy, tests, and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (workspace)
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace --locked --all-features

      - name: Build (workspace)
        run: cargo build --workspace --locked --all-features

  no-default-features:
    name: Generator without default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build codegen-only
        run: cargo build --locked -p convex-typegen --no-default-features

      - name: Test codegen-only
        run: cargo test --locked -p convex-typegen --no-default-features

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked -p convex-typegen --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked -p convex-typegen --all-features

      - name: Generator without default features
        run: cargo build --locked -p convex-typegen --no-default-features

      - name: Verify the build-dependency boundary
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/src" "$fixture/convex"
          cat > "$fixture/Cargo.toml" <<EOF
          [package]
          name = "generator-smoke"
          version = "0.0.0"
          edition = "2024"
          rust-version = "1.95"

          [build-dependencies]
          convex-typegen = { path = "$PWD" }
          EOF
          echo 'fn main() {}' > "$fixture/src/main.rs"
          echo 'fn main() { convex_typegen::generate(Default::default()).unwrap(); }' > "$fixture/build.rs"
          echo 'export default defineSchema({});' > "$fixture/convex/schema.ts"

          # Reuse the tested generator resolution and keep the fixture separate.
          cp Cargo.lock "$fixture/Cargo.lock"
          for features in "" "--features convex-typegen/verbose"; do
            graph=$(cargo tree --manifest-path "$fixture/Cargo.toml" --edges normal,build --prefix none $features)
            if grep -E '^(convex(-typegen-runtime|_sync_types)?|native-tls|tokio-native-tls|openssl[^ ]*|rustls[^ ]*|tokio-rustls) v' <<< "$graph"; then
              exit 1
            fi
          done
          cargo build --locked --manifest-path "$fixture/Cargo.toml"
          test -s "$fixture/src/convex_types.rs"

  runtime-msrv:
    name: Runtime MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: Check and test the runtime
        run: |
          cargo +1.85.0 check --locked -p convex-typegen-runtime
          cargo +1.85.0 test --locked -p convex-typegen-runtime

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: |
          cargo audit --file Cargo.lock \
            --ignore RUSTSEC-2026-0007 \
            --ignore RUSTSEC-2025-0004 \
            --ignore RUSTSEC-2025-0022

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Deny check
        run: cargo deny --workspace check
