[package]
name = "convex-typegen-runtime"
version = "0.4.0"
description = "Runtime support for Rust bindings generated by convex-typegen"
authors = ["Jamal Lyons"]
license = "MIT"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/JamalLyons/convex-typegen"

[dependencies]
convex = "0.10.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
