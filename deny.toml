[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "OpenSSL",
  "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Transitive advisories via `convex` → tokio-tungstenite / native-tls until upstream bumps.
[advisories]
ignore = [
  "RUSTSEC-2026-0007", # bytes 1.9.0 via convex
  "RUSTSEC-2025-0004", # openssl via native-tls
  "RUSTSEC-2025-0022", # openssl via native-tls
]
