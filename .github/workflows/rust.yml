name: Rust

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # `rustfmt.toml` uses unstable options; use nightly explicitly (matches `just fmt-check`).
      - name: rustfmt (workspace)
        run: cargo +nightly fmt --all --check

  clippy-test:
    name: Clippy, tests, and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (workspace)
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace --locked --all-features

      - name: Build (workspace)
        run: cargo build --workspace --locked --all-features

  no-default-features:
    name: Generator without default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build codegen-only
        run: cargo build --locked -p convex-typegen --no-default-features

      - name: Test codegen-only
        run: cargo test --locked -p convex-typegen --no-default-features

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify the generator MSRV
        run: bash scripts/generator-msrv.sh

  runtime-msrv:
    name: Runtime MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.85.0

      - name: Install the generator toolchain for pregeneration
        run: rustup toolchain install 1.97.0 --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Check the derive crate and test the runtime
        run: |
          cargo +1.85.0 build --locked -p convex-typegen-macros
          cargo +1.85.0 check --locked -p convex-typegen-runtime
          cargo +1.85.0 test --locked -p convex-typegen-runtime

      - name: Test pregenerated bindings in an external Rust 1.85 consumer
        run: bash scripts/runtime-msrv-consumer.sh

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: |
          cargo audit --file Cargo.lock \
            --ignore RUSTSEC-2026-0007 \
            --ignore RUSTSEC-2025-0004 \
            --ignore RUSTSEC-2025-0022

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Deny check
        run: cargo deny --workspace check
