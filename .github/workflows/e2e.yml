name: Local self-hosted Convex E2E

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Local Convex typed-client E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v4

      - name: Run against pinned local self-hosted backend
        run: just e2e
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/convex-typegen-e2e-artifacts

      - name: Upload sanitized backend logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: convex-self-hosted-e2e-backend-logs
          path: ${{ runner.temp }}/convex-typegen-e2e-artifacts/backend.log
          if-no-files-found: error
          retention-days: 7
