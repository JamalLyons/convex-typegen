name: Convex E2E compile

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Compile the Convex E2E consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build with the committed function spec
        run: cargo build --locked -p convex-typegen-e2e
        env:
          CONVEX_FUNCTION_SPEC_PATH: ${{ github.workspace }}/tests/fixtures/v1-review/function-spec.json
