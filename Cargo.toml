[package]
name = "convex-typegen"
version.workspace = true
description = "Build-time bindings for Convex schema and functions — end-to-end type safety in Rust"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
include = ["src/**", "Cargo.toml", "Cargo.lock", "readme.md", "LICENSE"]

# Documentation and repository links
documentation = "https://docs.rs/convex-typegen"
repository.workspace = true
homepage.workspace = true
readme = "readme.md"

# Metadata
categories = ["development-tools", "database", "web-programming"]
keywords = ["convex", "rust", "typegen", "database", "types"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Print Oxc parser/semantic diagnostics to stderr (in addition to `ParsingFailed::details`).
verbose = []
# Expose hidden pipeline stages to the unpublished benchmark harness only.
bench-internals = []

[dependencies]
base64 = "0.23"
oxc = { version = "0.157.0", features = ["semantic", "serialize"], default-features = false }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[dev-dependencies]
convex.workspace = true
convex-typegen-runtime.workspace = true
trybuild = "1"
insta.workspace = true
tempfile.workspace = true

[profile.dev]
opt-level = 1      # Make debug builds run faster
panic = "abort"    # Better optimizations and smaller binaries
debug = true       # Keep debug symbols for development

# Optimize all dependencies even in debug builds
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3      # Maximum optimization
lto = "thin"       # Enable link-time optimization
codegen-units = 1  # Maximize performance
panic = "abort"    # Better optimizations and smaller binaries
strip = true       # Remove debug symbols from the binary

[workspace]
members = ["runtime", "macros", "examples/*", "xtask", "benches", "e2e"]
resolver = "3"

[workspace.package]
version = "0.4.0"
authors = ["Jamal Lyons"]
license = "MIT"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/JamalLyons/convex-typegen"
homepage = "https://github.com/JamalLyons/convex-typegen"

[workspace.dependencies]
convex = "0.10.4"
convex-typegen = { path = "." }
convex-typegen-runtime = { path = "runtime" }
dotenvy = "0.15.7"
insta = { version = "1", features = ["filters"] }
serde = { version = "1.0.228", features = ["std", "derive"], default-features = false }
serde_json = "1.0.149"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
