[package]
name = "convex-typegen"
version = "0.4.0"
description = "Type safe bindings for ConvexDB in Rust"
authors = ["Jamal Lyons"]
license = "MIT"
edition = "2024"
rust-version = "1.95"
exclude = ["examples/", ".github/"]

# Documentation and repository links
documentation = "https://docs.rs/convex-typegen"
repository = "https://github.com/JamalLyons/convex-typegen"
homepage = "https://github.com/JamalLyons/convex-typegen"
readme = "readme.md"

# Metadata
categories = ["development-tools", "database", "web-programming"]
keywords = ["convex", "rust", "typegen", "database", "types"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["client"]
# Runtime helpers for the official Convex Rust client (`ConvexClientExt`, etc.).
client = ["dep:convex"]
# Print Oxc parser/semantic diagnostics to stderr (in addition to `ParsingFailed::details`).
verbose = []

[dependencies]
convex = { version = "0.10.4", optional = true }
oxc = { version = "0.129.0", features = ["semantic", "serialize"], default-features = false }
serde = { version = "1.0.228", features = ["std", "derive"], default-features = false }
serde_json = "1.0.149"
thiserror = "2.0.18"

[dev-dependencies]
insta = { version = "1", features = ["filters"] }
tempfile = "3"

[profile.dev]
opt-level = 1      # Make debug builds run faster
panic = "abort"    # Better optimizations and smaller binaries
debug = true       # Keep debug symbols for development

# Optimize all dependencies even in debug builds
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3      # Maximum optimization
lto = "thin"       # Enable link-time optimization
codegen-units = 1  # Maximize performance
panic = "abort"    # Better optimizations and smaller binaries
strip = true       # Remove debug symbols from the binary
